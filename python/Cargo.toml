[package]
name = "egobox"
authors.workspace = true
version = "1.1.0"
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
description = "A python binding for egobox crates"
readme = "README.md"

[lib]
name = "egobox"
crate-type = ["cdylib", "rlib"]
doctest = false                 # do not doctest as doc uses Python style for Python API doc

[features]
default = []
serializable-gp = ["egobox-gp/serializable"]
blas = ["ndarray/blas", "egobox-ego/blas"]

[dependencies]
egobox-doe = { version = "0.35.2", path = "../crates/doe" }
egobox-gp = { version = "0.39.0", path = "../crates/gp" }
egobox-moe = { version = "0.39.0", path = "../crates/moe" }
egobox-ego = { version = "0.45.0", path = "../crates/ego" }
egobox-gpx = { version = "0.8.0", path = "../crates/gpx" }


pyo3 = { version = "0.30.1" }
numpy = "0.30.0"

linfa.workspace = true
ndarray.workspace = true
ndarray-rand.workspace = true

rand_xoshiro.workspace = true
env_logger.workspace = true
log.workspace = true

serde.workspace = true
serde_json.workspace = true

argmin_testfunctions.workspace = true
pyo3-stub-gen = { version = "0.23.0", features = ["numpy"] }
bincode.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[[bin]]
name = "stub_gen"
doc = false

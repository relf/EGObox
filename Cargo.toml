[workspace]
members = ["crates/*", "python"]
resolver = "2"

[workspace.package]
license = "Apache-2.0"
edition = "2024"
authors = ["Rémi Lafage <remi.lafage@onera.fr>"]
repository = "https://github.com/relf/EGObox"

[workspace.metadata.release]
shared-version = true
tag-name = "{{version}}"

[workspace.dependencies]
basin = { version = "3.3", default-features = false }
linfa = { version = "0.9", default-features = false }
linfa-linalg = { version = "0.2", default-features = false }

ndarray = { version = "0.16", features = ["rayon", "approx"] }
ndarray-rand = "0.15"
ndarray-stats = "0.6"
ndarray-npy = { version = "0.9", default-features = false }
statrs = "0.18"

num-traits = "0.2"

thiserror = "2"
anyhow = "1"
rayon = "1"

rand_xoshiro = "0.6.0"
finitediff = { version = "0.2", features = ["ndarray"] }
env_logger = "0.11"
log = "0.4"

serde = "1"
serde_json = "1"

clap = { version = "4", features = ["derive"] }
# binary GP model files, same codec and features as basin checkpoints
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

# dev dependencies 
criterion = "0.8.2"
approx = "0.5"
argmin_testfunctions = "0.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package]
name = "egobox-ego"
authors.workspace = true
version = "0.45.0"
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "A library for efficient global optimization"
keywords = ["machine-learning", "bayesian", "optimization"]
categories = ["algorithms", "mathematics", "science"]

[features]
default = []
blas = ["egobox-gp/blas", "egobox-moe/blas"]

[dependencies]
basin = { workspace = true, features = ["serde"] }
egobox-doe = { version = "0.35.2", path = "../doe", features = [
    "serializable",
] }
egobox-gp = { version = "0.39.0", path = "../gp", features = ["serializable"] }
egobox-moe = { version = "0.39.0", path = "../moe" }

linfa.workspace = true
linfa-linalg.workspace = true
linfa-pls = { version = "0.9", default-features = false }
linfa-clustering = { version = "0.9", default-features = false }

ndarray.workspace = true
ndarray-stats.workspace = true
ndarray-rand.workspace = true
ndarray-npy.workspace = true
rayon.workspace = true


rand_xoshiro = { version = "0.6", features = ["serde1"] }
bincode.workspace = true
web-time = "1.1.0"
libm = "0.2.6"
finitediff.workspace = true
# sort-axis
rawpointer = { version = "0.2" }
log.workspace = true
env_logger.workspace = true
thiserror.workspace = true
anyhow.workspace = true
clap.workspace = true

serde = { version = "1", features = ["derive", "rc"] }
serde_json.workspace = true
typetag = { version = "0.2" }
dyn-clonable = { version = "0.9" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
criterion.workspace = true
approx.workspace = true
argmin_testfunctions.workspace = true
serial_test = "3.1.0"

[[bench]]
name = "ego"
harness = false

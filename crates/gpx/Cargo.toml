[package]
name = "egobox-gpx"
version = "0.5.1"
authors.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
description = "GP surrogate executable for quality assessment, I/O specification, and prediction"
keywords = ["machine-learning", "bayesian", "optimization"]
categories = ["algorithms", "mathematics", "science"]

[features]
# Use cobyla crate (C-ported NLopt COBYLA) instead of basin COBYLA
c-cobyla = ["egobox-ego/c-cobyla", "egobox-moe/c-cobyla"]
# Use slsqp crate (C-ported NLopt SLSQP) instead of basin SLSQP
c-slsqp = ["egobox-ego/c-slsqp"]

[dependencies]
egobox-ego = { version = "0.40", path = "../ego" }
egobox-moe = { version = "0.35", path = "../moe" }
anyhow.workspace = true
clap.workspace = true
bincode.workspace = true
serde_json.workspace = true
rayon.workspace = true
ndarray.workspace = true
ndarray-npy.workspace = true
linfa.workspace = true
csv = "1.3"

[[bin]]
path = "src/main.rs"
name = "gpx"

# TEMPORARY: regenerate mono-objective snapshot fixtures in the CI environment.
# To be removed once the fixtures are committed.
name: update-snapshots

on:
  push:
    branches: [ gp-fused-posterior-gradients ]

env:
  CARGO_TERM_COLOR: always

jobs:

  update-snapshots:
    name: update-snapshots-${{ matrix.os }}-default
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Log active toolchain
        run: rustup show

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Regenerate snapshots
        env:
          EGOBOX_UPDATE_SNAPSHOTS: '1'
        run: cargo test --all --release --test mono_snapshots

      - name: Check snapshots against regenerated fixtures
        run: cargo test --all --release --test mono_snapshots

      - name: Upload fixtures
        uses: actions/upload-artifact@v6
        with:
          name: snapshots-${{ runner.os }}
          path: crates/ego/tests/snapshots/

name: tests

on: 
  pull_request:
    branches: [ master, egmdo ]
  push:
    branches: [ master, egmdo ]
  
env:
  CARGO_TERM_COLOR: always

jobs:

  test:
    name: testing-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        backend: [default]
        toolchain:
          - stable
        os: 
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - toolchain: 1.88.0  # test MSRV
            os: ubuntu-latest
            backend: default

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          override: true

      - name: Log active toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # dependency features differ without the Python bindings crate
          prefix-key: v1-rust
          key: ${{ matrix.backend }}
          # pull requests restore master caches but do not save their own
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run cargo test in release mode
        uses: actions-rs/cargo@v1
        env:
          # mono-objective snapshot fixtures are required on the reference job
          EGOBOX_REQUIRE_SNAPSHOTS: ${{ (matrix.os == 'ubuntu-latest' && matrix.backend == 'default' && matrix.toolchain == 'stable') && '1' || '0' }}
        with:
          command: test
          args: --workspace --exclude egobox --release

      # When the Linux reference job or the Windows job fails, record the snapshot fixtures
      # as computed by CI (to be reviewed, then committed for the new or intentionally
      # changed scenarios)
      - name: Record snapshot fixtures
        if: failure() && matrix.os != 'macos-latest' && matrix.backend == 'default' && matrix.toolchain == 'stable'
        env:
          EGOBOX_UPDATE_SNAPSHOTS: '1'
        run: cargo test --release -p egobox-ego --test mono_snapshots --test moo_snapshots

      - name: Upload recorded snapshot fixtures
        if: failure() && matrix.os != 'macos-latest' && matrix.backend == 'default' && matrix.toolchain == 'stable'
        uses: actions/upload-artifact@v6
        with:
          name: snapshots-${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}-default
          path: crates/ego/tests/snapshots/${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}-default

  test-features:
    name: testing-features-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        features:
          - blas,linfa/intel-mkl-static
        toolchain:
          - stable
        os: 
          - ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          override: true

      - name: Log active toolchain
        run: rustup show

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # dependency features differ without the Python bindings crate
          prefix-key: v1-rust
          key: mkl
          # pull requests restore master caches but do not save their own
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run cargo test in release mode
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --workspace --exclude egobox --release --features ${{ matrix.features }}



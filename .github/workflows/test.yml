name: tests

on: 
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  
env:
  CARGO_TERM_COLOR: always

jobs:

  test:
    name: testing-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        backend: [default, c-optim]
        toolchain:
          - stable
        os: 
          - ubuntu-latest
          - windows-latest
          - macos-latest
        include:
          - toolchain: 1.88.0  # test MSRV
            os: ubuntu-latest
            backend: default
          - toolchain: 1.88.0
            os: ubuntu-latest
            backend: c-optim

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          override: true

      - name: Log active toolchain
        run: rustup show

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Run cargo test in release mode
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all --release ${{ matrix.backend == 'c-optim' && '--features c-cobyla,c-slsqp' || '' }}

  test-features:
    name: testing-features-${{ matrix.toolchain }}-${{ matrix.os }}-${{ matrix.features }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        features:
          - blas,linfa/intel-mkl-static
          - c-cobyla,c-slsqp
        toolchain:
          - stable
        os: 
          - ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          override: true

      - name: Log active toolchain
        run: rustup show

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12' 

      - name: Run cargo test in release mode
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --all --release --features ${{ matrix.features }}



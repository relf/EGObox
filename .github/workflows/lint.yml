name: lint

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:

  lint:
    name: linting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
        features: [default, c-optim]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: ${{ matrix.toolchain }}
          override: true
          components: rustfmt, clippy

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets ${{ matrix.features == 'c-optim' && '--features c-cobyla,c-slsqp' || '' }} -- -D warnings

  semver:
    name: semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check egobox-ego API against the base branch
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: egobox-ego
          baseline-rev: ${{ github.event.pull_request.base.sha }}
